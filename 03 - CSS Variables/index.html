<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1 class="title">Update CSS Variables with <span class="subtitle">JS</span></h1>
        <div class="wrapper">
            <div class="input-group">
                <label for="spacing">Spacing:</label>
                <input type="range" name="spacing" id="spacing" min="0" max="50">
            </div>
            <div class="input-group">
                <label for="blur">Blur:</label>
                <input type="range" name="blur" id="blur" min="0" max="10">
            </div>
            <div class="input-group">
                <label for="color">Base Color:</label>
                <input type="color" name="color" id="color">
            </div>
        </div>
        <div class="frame">
            <img src="https://images.unsplash.com/photo-1770752986377-1982c76424e8?q=80&w=881&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="mountains">
        </div>
    </main>
</body>
</html>
