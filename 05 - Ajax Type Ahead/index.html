<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries Data</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <div class="container">
            <input type="text" name="query" placeholder="City or State">
            <ul class="list">
                <li class="item">
                    <p>
                        <span class="country">Filter For A City</span>
                        <span class="state"></span>
                    </p>
                    <p class="population"></p>
                </li>
                <li class="item">
                    <p>
                        <span class="country">Or A State</span>
                        <span class="state"></span>
                    </p>
                    <p class="population"></p>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
