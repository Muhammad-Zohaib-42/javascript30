<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Drum Kit</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <div class="wrapper">
            <button data-sound="clap.wav">
                <h2>A</h2>
                <span>CLAP</span>
            </button>
            <button data-sound="hihat.wav">
                <h2>S</h2>
                <span>HIHAT</span>
            </button>
            <button data-sound="kick.wav">
                <h2>D</h2>
                <span>KICK</span>
            </button>
            <button data-sound="openhat.wav">
                <h2>F</h2>
                <span>OPENHAT</span>
            </button>
            <button data-sound="boom.wav">
                <h2>G</h2>
                <span>BOOM</span>
            </button>
            <button data-sound="ride.wav">
                <h2>H</h2>
                <span>RIDE</span>
            </button>
            <button data-sound="snare.wav">
                <h2>J</h2>
                <span>SNARE</span>
            </button>
            <button data-sound="tom.wav">
                <h2>K</h2>
                <span>TOM</span>
            </button>
            <button data-sound="tink.wav">
                <h2>L</h2>
                <span>TINK</span>
            </button>
        </div>
    </main>
</body>
</html>
